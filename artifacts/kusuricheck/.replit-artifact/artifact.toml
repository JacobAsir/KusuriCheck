kind = "web"
previewPath = "/"
title = "KusuriCheck"
version = "1.0.0"
id = "artifacts/kusuricheck"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26271

[services.development]
run = "pnpm --filter @workspace/kusuricheck run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/kusuricheck", "run", "build" ]
publicDir = "artifacts/kusuricheck/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26271"
BASE_PATH = "/"
