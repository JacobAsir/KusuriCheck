services:
  api:
    build:
      context: ./artifacts/api-server
      dockerfile: Dockerfile
    image: kusuricheck-api:latest
    environment:
      APP_ENV: production
      LOG_LEVEL: INFO
      MAX_UPLOAD_MB: "10"
      # Leave AI keys blank for mock-mode operation.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    expose:
      - "8080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/api/healthz', timeout=3).status == 200 else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: ./artifacts/kusuricheck/Dockerfile
    image: kusuricheck-web:latest
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped
