services:
  # --- Backend: FastAPI Web Service ---
  - type: web
    name: kusuricheck-backend
    plan: free   # Explicitly set to free
    env: python
    buildCommand: pip install -r artifacts/api-server/requirements.txt
    startCommand: cd artifacts/api-server && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false # Set this in Render Dashboard
      - key: CORS_ALLOWED_ORIGINS
        value: "*" # Update this to your frontend URL after deployment
      - key: PYTHON_VERSION
        value: 3.11.9

  # --- Frontend: Static Site ---
  - type: web            
    name: kusuricheck-frontend
    runtime: static      
    installCommand: pnpm install --no-frozen-lockfile
    buildCommand: pnpm --filter @workspace/api-spec run codegen && pnpm --filter @workspace/kusuricheck run build
    staticPublishPath: ./artifacts/kusuricheck/dist/public
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: VITE_API_URL
        fromService:
          type: web
          name: kusuricheck-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
